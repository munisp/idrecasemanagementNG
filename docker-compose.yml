# Local development stack — full platform, no external/cloud dependencies.
# Heavy security/FinOps components (Wazuh, OpenCTI, Kubecost) are k8s-only; see deploy/helm-values.
name: nsa-idre-platform

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: idre
      POSTGRES_PASSWORD: idre
      POSTGRES_DB: idre
    # Local-dev parity with deploy/helm-values/postgres.yaml (scaled to laptop)
    command:
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=32MB
      - -c
      - wal_compression=lz4
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - idle_in_transaction_session_timeout=60000
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./scripts/init-schemas.sql:/docker-entrypoint-initdb.d/init.sql"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  kafka:  # KRaft, single broker for local
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]

  temporal:
    image: temporalio/auto-setup:1.24
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: idre
      POSTGRES_PWD: idre
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ["7233:7233"]
    depends_on: [postgres]

  temporal-ui:
    image: temporalio/ui:2.31
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ["8233:8080"]
    depends_on: [temporal]

  tigerbeetle:  # 3 replicas in k8s; single node locally
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.0
    command: ["start", "--addresses=0.0.0.0:3000", "--development", "/data/0_0.tigerbeetle"]
    ports: ["3000:3000"]
    volumes: ["tbdata:/data"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports: ["8085:8080"]
    volumes:
      - "./deploy/keycloak/realm-idre.json:/opt/keycloak/data/import/realm-idre.json"
      - "./deploy/keycloak/themes/idre:/opt/keycloak/themes/idre:ro"

  apisix:
    image: apache/apisix:3.11.0-debian
    ports: ["9080:9080", "9180:9180"]
    volumes: ["./deploy/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml",
              "./deploy/apisix/config.yaml:/usr/local/apisix/conf/config.yaml"]

  minio:  # S3-compatible object store: documents (ciphertext) + Delta tables
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: idre
      MINIO_ROOT_PASSWORD: idre-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  opensearch:
    image: opensearchproject/opensearch:2.17
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Idre#Admin123"
      DISABLE_SECURITY_PLUGIN: "true"
    ports: ["9200:9200"]

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports: ["5601:5601"]
    depends_on: [opensearch]

  spark-master:
    image: bitnami/spark:3.5
    environment: [SPARK_MODE=master]
    ports: ["7077:7077", "8082:8080"]

  spark-worker:
    image: bitnami/spark:3.5
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
    depends_on: [spark-master]

  ray-head:
    image: rayproject/ray:2.40.0-py312
    command: ["ray", "start", "--head", "--dashboard-host=0.0.0.0", "--block"]
    ports: ["8265:8265", "10001:10001"]
    shm_size: "2gb"

  # ---- platform services (build locally) -------------------------------------
  portal:  # PWA + native shell source; nginx serves the app shell
    image: nginx:1.27-alpine
    ports: ["3001:80"]
    volumes:
      - ./portal:/usr/share/nginx/html:ro
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [apisix]

  case-api:
    build: ./services/case-api-go
    environment:
      DATABASE_URL: postgres://idre:idre@postgres:5432/idre
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/idre/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8085/realms/idre
      TEMPORAL_HOST: temporal:7233
      TIGERBEETLE_ADDRESSES: tigerbeetle:3000
      VAULT_URL: http://vault:8081
      REDIS_ADDR: redis:6379            # JWKS cache + initiate idempotency
      PERMIFY_URL: http://permify:3476  # ReBAC object-level authorization (unset = dev bypass)
      GRAPH_INTEL_URL: http://graph-intel:8082  # FalkorDB + GraphSAGE + EPR-KGQA proxy target
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}    # sk_live_…/sk_test_…; unset = card payments disabled
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}  # whsec_… from `stripe listen` / dashboard endpoint
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:8080}  # Stripe success/cancel return
      CLAMD_ADDR: clamd:3310
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-idre@localhost}                  # ClamAV malware scanner (uploads fail-closed if down)
    ports: ["8080:8080"]
    depends_on: [postgres, temporal, tigerbeetle, keycloak, vault, redis, permify, clamd]

  lettergen:
    build: ./services/lettergen-py
    environment:
      DATABASE_URL: postgres://idre:idre@postgres:5432/idre
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_USER: idre
      MINIO_PASSWORD: idre-secret
      VAULT_URL: http://vault:8081
    depends_on: [postgres, kafka, minio, vault]

  clamd:
    image: clamav/clamav:stable           # freshclam updates signatures on start
    ports: ["3310:3310"]
    volumes:
      - clamdb:/var/lib/clamav

  vault:
    build: ./services/vault-rs
    environment:
      VAULT_MASTER_SECRET: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"  # dev only
      CASE_API_URL: http://case-api:8080
      VAULT_INTERNAL_TOKEN: dev-internal-token
    ports: ["8081:8081"]

  idre-workflows:
    build: ./services/idre-workflows-py
    environment:
      DATABASE_URL: postgres://idre:idre@postgres:5432/idre
      TEMPORAL_HOST: temporal:7233
      CASE_API_URL: http://case-api:8080
      VAULT_URL: http://vault:8081
      DAPR_APP_PORT: "9100"  # Dapr cron binding invokes POST /cms-monthly here
    ports: ["9100:9100"]
    depends_on: [temporal, case-api]

  doc-intel:  # PaddleOCR + VLM document analysis; GPU optional (auto-detect)
    build: ./services/doc-intel-py
    environment:
      DATABASE_URL: postgres://idre:idre@postgres:5432/idre
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      VAULT_URL: http://vault:8081
      CASE_API_URL: http://case-api:8080
      OPENSEARCH_URL: http://opensearch:9200
      VLM_ENDPOINT: ${VLM_ENDPOINT:-http://vllm:8000/v1}
      VLM_MODEL: ${VLM_MODEL:-paddleocr-vl}
    depends_on: [kafka, minio, vault, opensearch]

  outbox-relay:  # Postgres outbox -> Kafka; without it the event backbone is silent
    build: ./services/outbox-relay-py
    environment:
      PG_DSN: postgresql://idre:idre@postgres:5432/idre
      KAFKA_BROKERS: kafka:9092
    depends_on: [postgres, kafka]

  permify:  # ReBAC authorization (schema: deploy/permify/schema.perm)
    image: ghcr.io/permify/permify:v1.4.8
    command: ["serve", "--database-engine=postgres",
              "--database-uri=postgres://idre:idre@postgres:5432/idre?sslmode=disable",
              "--database-max-open-connections=20"]
    ports: ["3476:3476"]
    depends_on: [postgres]

  fluvio:  # edge streaming (voice/portal events at the edge); sc daemon for local
    image: infinyon/fluvio:stable
    profiles: ["edge"]
    ports: ["9003:9003"]

  edge-bridge:  # Fluvio edge topics -> Kafka core topics (tenant routing preserved)
    build: ./services/edge-bridge-py
    profiles: ["edge"]
    environment:
      KAFKA_BROKERS: kafka:9092
      FLUVIO_ENDPOINT: fluvio:9003
      TENANTS: ${TENANTS:-tx,ca,ny}
    depends_on: [kafka, fluvio]

  vllm:  # optional: VLM serving (PaddleOCR-VL / Qwen2.5-VL); disable to use external endpoint
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: ["--model", "PaddlePaddle/PaddleOCR-VL", "--max-model-len", "8192"]
    ports: ["8000:8000"]
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  falkordb:  # dispute graph — one graph per tenant (idre_<st>), Cypher over RESP
    image: falkordb/falkordb:latest
    ports: ["6397:6379"]

  ollama:  # local LLM for EPR-KGQA answers — no PHI ever leaves the platform
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]
    # first boot: docker exec <ollama> ollama pull qwen2.5:3b

  graph-intel:  # FalkorDB sync + numpy GraphSAGE + EPR-KGQA + lakehouse bridge
    build: ./services/graph-intel-py
    environment:
      DATABASE_URL: postgres://idre:idre@postgres:5432/idre
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      LAKEHOUSE_DIR: /lakehouse
    volumes: ["lakehouse:/lakehouse"]
    ports: ["8082:8082"]
    depends_on: [postgres, falkordb, ollama]

volumes:
  pgdata:
  tbdata:
  miniodata:
  ollamadata:
  lakehouse:
  clamdb:
