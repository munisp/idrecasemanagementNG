server:
  replicaCount: 2
  # History shards: the single biggest Temporal scaling knob. 4096 is
  # immutable after bootstrap — size for the lifetime of the cluster.
  numHistoryShards: 4096
  config:
    persistence:
      default:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-rw.idre-core
          port: 5432
          user: idre
          database: temporal
          existingSecret: temporal-db
      visibility:
        driver: sql
        sql:
          driver: postgres12
          host: postgres-rw.idre-core
          port: 5432
          user: idre
          database: temporal_visibility
          existingSecret: temporal-db
    dynamicConfig:
      # Throughput guardrails per namespace (ratchet up per-tenant as needed)
      matching.longPollExpirationInterval: "30s"
      history.timerProcessorMaxPollRPS: 200
      frontend.namespaceRPS: 3000
    namespaces:
      create: true
      namespace:
        - name: idre
          retention: 30d   # workflow history retention (audit trail)
web:
  enabled: true            # Temporal UI
cassandra: { enabled: false }
elasticsearch: { enabled: false }   # OpenSearch advanced visibility is optional
prometheus: { enabled: true }
