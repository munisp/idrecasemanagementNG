# CloudNativePG operator values; the Cluster CR below is applied separately.
mode: standalone
cluster:
  instances: 3
  storage:
    size: 200Gi
    storageClass: gp3
  # Schema-per-tenant provisioning is idempotent: scripts/init-schemas.sql runs
  # on bootstrap; new tenants are provisioned by scripts/provision-tenant.sh.
  postgresql:
    parameters:
      wal_level: logical        # logical slots for the outbox/CDC publisher
      max_replication_slots: "16"
      shared_preload_libraries: "pg_stat_statements"
      # --- Throughput tuning (per-node: 16 vCPU / 64 GiB reference shape) ----
      max_connections: "500"             # fronted by PgBouncer sidecar (txn pooling)
      shared_buffers: "16GB"             # 25% of node RAM
      effective_cache_size: "48GB"       # ~75% — planner cost model
      work_mem: "64MB"                   # per sort/hash op; watch temp_files
      maintenance_work_mem: "2GB"
      wal_compression: "lz4"
      max_wal_size: "16GB"               # fewer checkpoint stalls under write bursts
      checkpoint_completion_target: "0.9"
      random_page_cost: "1.1"            # gp3/NVMe SSD, not spinning disk
      effective_io_concurrency: "200"
      max_worker_processes: "16"
      max_parallel_workers: "16"
      max_parallel_workers_per_gather: "4"
      max_parallel_maintenance_workers: "4"
      autovacuum_max_workers: "6"        # schema-per-tenant = many hot tables
      autovacuum_naptime: "15s"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.02"
      idle_in_transaction_session_timeout: "60000"   # kill forgotten txns
      statement_timeout: "30000"         # API guardrail; workers override locally
      pg_stat_statements.track: "all"
  monitoring:
    enablePodMonitor: true
  backup:
    retentionPolicy: "30d"
    # PITR to S3 (MinIO in-cluster endpoint) — required for 6-year retention.
