replicaCount: 3
gateway:
  type: LoadBalancer
  tls:
    enabled: true
    # cert-manager issues Let's Encrypt certs; open-appsec WAF agent attached below.
ingress-controller:
  enabled: true
  config:
    apisix:
      adminAPIVersion: v3
apisix:
  deployment:
    role: data_plane
  nginx_config:
    worker_processes: auto          # one event loop per core
    worker_connections: 65535
    http:
      enable_http2: true
      keepalive_timeout: 75s
      client_max_body_size: 50m
      lua_shared_dict:
        plugin-limit-count: 50m
        prometheus-metrics: 50m
  extraEnvVars:
    - name: APISIX_STAND_ALONE
      value: "false"   # etcd-backed in prod; standalone yaml used only for local
# open-appsec: deploy the appsec agent in this namespace and enable the APISIX
# integration (see https://docs.openappsec.io — APISIX attachment). The agent
# enforces ML-based detection, API schema validation, and bot mitigation.
etcd:
  enabled: true
  replicaCount: 3
metrics:
  serviceMonitor: { enabled: true }
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65
