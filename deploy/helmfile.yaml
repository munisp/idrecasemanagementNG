# helmfile — declarative fleet install for every platform component.
# Usage: helmfile sync   (requires helm + helm-diff)
repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: strimzi
    url: https://strimzi.io/charts/
  - name: temporal
    url: https://go.temporal.io/helm-charts
  - name: apisix
    url: https://charts.apiseven.com
  - name: keycloak
    url: https://charts.bitnami.com/bitnami
  - name: opensearch
    url: https://opensearch-project.github.io/helm-charts/
  - name: fluvio
    url: https://infinyon.github.io/fluvio-helm
  - name: kubecost
    url: https://kubecost.github.io/cost-analyzer/
  - name: wazuh
    url: https://wazuh.github.io/wazuh-kubernetes/
  - name: opencti
    url: https://opencti-platform.github.io/helm-charts
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: minio
    url: https://charts.min.io/
  - name: spark
    url: https://charts.bitnami.com/bitnami
  - name: ray
    url: https://ray-project.github.io/kuberay-helm/
  - name: flink
    url: https://archive.apache.org/dist/flink/flink-kubernetes-operator-1.9.0/
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: cilium
    url: https://helm.cilium.io/

releases:
  # ---- dataplane (FIRST — Cilium is the CNI; nothing schedules without it) --
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    values: [helm-values/cilium.yaml]
  - name: tetragon
    namespace: kube-system
    chart: cilium/tetragon
    values: [helm-values/tetragon.yaml]
    needs: [kube-system/cilium]

  # ---- core -----------------------------------------------------------------
  - name: postgres
    namespace: idre-core
    chart: cnpg/cloudnative-pg
    values: [helm-values/postgres.yaml]
  - name: redis
    namespace: idre-core
    chart: bitnami/redis
    values: [helm-values/redis.yaml]
  - name: temporal
    namespace: idre-core
    chart: temporal/temporal
    values: [helm-values/temporal.yaml]
  - name: keycloak
    namespace: idre-core
    chart: keycloak/keycloak
    values: [helm-values/keycloak.yaml]
  - name: apisix
    namespace: idre-core
    chart: apisix/apisix
    values: [helm-values/apisix.yaml]

  # ---- data -------------------------------------------------------------------
  - name: kafka
    namespace: idre-data
    chart: strimzi/strimzi-kafka-operator
    values: [helm-values/kafka.yaml]
  - name: fluvio
    namespace: idre-data
    chart: fluvio/fluvio-app
    values: [helm-values/fluvio.yaml]
  - name: minio
    namespace: idre-data
    chart: minio/minio
    values: [helm-values/minio.yaml]
  - name: opensearch
    namespace: idre-data
    chart: opensearch/opensearch
    values: [helm-values/opensearch.yaml]
  - name: flink-operator
    namespace: idre-data
    chart: flink/flink-kubernetes-operator
  - name: spark
    namespace: idre-data
    chart: spark/spark
    values: [helm-values/spark.yaml]
  - name: ray
    namespace: idre-data
    chart: ray/kuberay-operator
    values: [helm-values/ray.yaml]

  # ---- security & finops -------------------------------------------------------
  - name: wazuh
    namespace: idre-security
    chart: wazuh/wazuh
    values: [helm-values/wazuh.yaml]
  - name: opencti
    namespace: idre-security
    chart: opencti/opencti
    values: [helm-values/opencti.yaml]
  - name: kubecost
    namespace: idre-finops
    chart: kubecost/cost-analyzer
    values: [helm-values/kubecost.yaml]
  # ---- autoscaling ------------------------------------------------------------
  - name: keda
    namespace: idre-obs
    chart: kedacore/keda
    values:
      - resources:
          operator:
            requests: { cpu: 100m, memory: 128Mi }
          metricServer:
            requests: { cpu: 100m, memory: 128Mi }
