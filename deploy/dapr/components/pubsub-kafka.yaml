apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: idre-pubsub
  namespace: idre-core
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "kafka.idre-data:9092"
    - name: authType
      value: "none"          # prod: mtls via cert-manager
    - name: consumerGroup
      value: "idre-services"
    - name: disableEntityManagement
      value: "false"
    - name: maxMessageBytes
      value: "1048576"
    # Throughput: match the relay producer (lz4 micro-batches) and give the
    # consumer group deeper fetch buffers for fan-out bursts.
    - name: initialOffset
      value: "oldest"
    - name: version
      value: "3.8.0"           # match cluster (deploy/helm-values/kafka.yaml)
    # Note: sarama fetch buffers/session timeouts are NOT exposed by the Dapr
    # Kafka component — consumer throughput is tuned app-side via bulk
    # subscribe + maxConcurrentHandlers annotations, and broker-side via the
    # tuned kafka.yaml. Delivery retries live in resiliency.yaml.
scopes:
  - case-api
  - notifier
