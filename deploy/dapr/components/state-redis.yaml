# Author: Patrick Munis at newwave
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: idre-state
  namespace: idre-core
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis.idre-core:6379"
    - name: redisPassword
      secretKeyRef: { name: redis, key: password }
    - name: ttlInSeconds
      value: "3600"          # IDRE directory / fee-schedule cache entries
scopes:
  - case-api
