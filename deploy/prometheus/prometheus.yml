# Author: Patrick Munis at newwave
# Prometheus scrape config for the composed stack. In k8s this is replaced by
# the Prometheus Operator's ServiceMonitors (deploy/kubernetes/).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/idre-alerts.yml

scrape_configs:
  - job_name: case-api
    metrics_path: /metrics
    static_configs:
      - targets: ["case-api:8080"]
        labels: { service: case-api }

  # The supporting services expose their own metrics natively:
  - job_name: tigerbeetle
    static_configs:
      - targets: ["tigerbeetle:3000"]
        labels: { service: tigerbeetle }

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
        labels: { service: minio }
