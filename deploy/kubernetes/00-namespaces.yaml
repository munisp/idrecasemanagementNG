# Default-deny east-west; explicit allows are added per service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: idre-core }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
