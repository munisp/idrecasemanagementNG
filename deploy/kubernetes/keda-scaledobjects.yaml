# KEDA event-driven autoscaling. Install: helmfile sync (keda release added).
#
# Design notes:
# - outbox-relay scales on REAL work depth: unpublished outbox rows across
#   tenant schemas (PostgreSQL scaler). Scale-to-zero when idle; SKIP LOCKED
#   in relay_once() makes multi-replica claiming safe.
# - case-api keeps its HPA-style CPU scaling (replicaCount floor 3 in
#   apps.yaml); KEDA CPU scalers are redundant with the HPA resource metric.
# - Kafka consumers that later need lag-based scaling (e.g. a notifier
#   service): use the `kafka` scaler with lagThreshold — template below in
#   comments, intentionally not applied to a service that doesn't exist yet.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outbox-relay
  namespace: idre-core
spec:
  scaleTargetRef:
    name: outbox-relay
  minReplicaCount: 1        # keep one warm: outbox latency SLO is seconds
  maxReplicaCount: 8
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: postgresql
      metadata:
        connectionFromEnv: DATABASE_URL
        query: >-
          SELECT COALESCE(SUM(cnt),0) FROM (
            SELECT count(*) AS cnt FROM tenant_tx.outbox WHERE published_at IS NULL
            UNION ALL
            SELECT count(*) FROM tenant_fl.outbox WHERE published_at IS NULL
          ) t
        targetQueryValue: "500"     # ~500 unpublished rows per replica
        activationQueryValue: "50"  # below this, stay at min
      # Tenant schemas multiply as states onboard; regenerate this query from
      #   SELECT string_agg(format('SELECT count(*) FROM %I.outbox WHERE
      #     published_at IS NULL','tenant_'||state), ' UNION ALL ')
      # or move to a Prometheus scaler on a relay-exported gauge.
---
