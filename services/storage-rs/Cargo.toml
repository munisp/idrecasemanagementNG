# Author: Patrick Munis at newwave
[package]
authors = ["Patrick Munis at newwave"]
name = "storage"
version = "0.1.0"
edition = "2021"

[features]
default = ["s3", "fs", "memory"]
s3 = ["opendal/services-s3"]
fs = ["opendal/services-fs"]
memory = ["opendal/services-memory"]
gcs = ["opendal/services-gcs"]
azblob = ["opendal/services-azblob"]

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opendal = { version = "0.59", default-features = false, features = ["layers-retry"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
hex = "0.4"
